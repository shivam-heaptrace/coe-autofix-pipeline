# SonarCloud project configuration
# ─────────────────────────────────
# Replace <YOUR_ORG> and <YOUR_REPO> with your SonarCloud org key and project key.
# Create the project at https://sonarcloud.io and add SONAR_TOKEN to repo secrets.

sonar.projectKey=<YOUR_ORG>_<YOUR_REPO>
sonar.organization=<YOUR_ORG>

sonar.projectName=Fulcrum AI COE POC
sonar.projectVersion=1.0

# Sources and tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.exclusions=node_modules/**,coverage/**

# Coverage report (generated by jest --coverage --coverageReporters=lcov)
sonar.javascript.lcov.reportPaths=src/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gate — fail the PR if the gate is not green
sonar.qualitygate.wait=true
