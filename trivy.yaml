# trivy.yaml — Trivy configuration for the Fulcrum AI COE POC
# Applied automatically when Trivy is run from the repo root.

scan:
  # Scan both library dependencies and misconfigurations
  scanners:
    - vuln
    - misconfig
    - secret

severity:
  - CRITICAL
  - HIGH
  # Include MEDIUM for visibility; the autofix gate only pages on CRITICAL/HIGH
  - MEDIUM

pkg:
  types:
    - os
    - library

vulnerability:
  # Skip findings where no fix is available yet
  ignore-unfixed: true

# Output: the workflow overrides this to sarif; keep json here for local use
format: json
output: trivy-local-results.json
