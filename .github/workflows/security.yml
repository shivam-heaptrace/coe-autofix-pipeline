name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run nightly at 02:00 UTC on main
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write   # required for SARIF upload
  pull-requests: write     # allows posting PR comments on findings
  actions: read

jobs:
  # ──────────────────────────────────────────────
  # 1. CodeQL — static analysis (JS/TS by default;
  #    add "python", "go", etc. if your stack changes)
  # ──────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Point at your source; adjust if your code lives elsewhere
          source-root: src
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          # SARIF goes to GitHub's Security tab; also saved as artifact below
          output: codeql-results.sarif

      - name: Upload CodeQL SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results.sarif
          retention-days: 7

  # ──────────────────────────────────────────────
  # 2. Trivy — container & filesystem vulnerability scan
  # ──────────────────────────────────────────────
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          # Treat HIGH+ findings as a blocking failure
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 7

      # ── Post a plain-English summary comment on the PR ──
      - name: Parse Trivy findings and comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sarif = JSON.parse(fs.readFileSync('trivy-results.sarif', 'utf8'));
            const results = sarif.runs?.[0]?.results ?? [];
            if (results.length === 0) return;

            const lines = results.slice(0, 10).map(r => {
              const rule = r.ruleId ?? 'unknown';
              const msg  = r.message?.text ?? '';
              const loc  = r.locations?.[0]?.physicalLocation?.artifactLocation?.uri ?? '';
              return `- **${rule}** in \`${loc}\`: ${msg}`;
            });
            const more = results.length > 10 ? `\n…and ${results.length - 10} more findings.` : '';

            const body = [
              '## 🔍 Trivy Security Findings',
              '',
              'The following vulnerabilities were detected. The **autofix workflow** will attempt to patch them.',
              '',
              '<!-- trivy-findings-start -->',
              ...lines,
              more,
              '<!-- trivy-findings-end -->',
              '',
              '> Trigger: post this comment or push a fix commit to re-run autofix.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  # ──────────────────────────────────────────────
  # 3. Secret scanning via Gitleaks
  # ──────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for secret detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gitleaks-action always writes results.sarif; --report-path in args is ignored
      - name: Stage Gitleaks SARIF for upload
        if: always()
        run: |
          if [ -f results.sarif ]; then
            cp results.sarif gitleaks-results.sarif
          fi

      - name: Upload Gitleaks SARIF to GitHub Security tab
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      - name: Upload Gitleaks SARIF artifact
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks-results.sarif
          retention-days: 7

      - name: Comment on PR if secrets found
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 🚨 Secret Scan Failure',
              '',
              'Gitleaks detected a potential secret or credential in this branch.',
              '',
              '**Do not merge.** Rotate the credential immediately if it is real.',
              '',
              'The autofix workflow will flag the file and line, but **it cannot safely',
              'remove a secret that has already been committed** — you must rotate first,',
              'then remove the value and force-push to clear history, or use `git filter-repo`.',
              '',
              '> See the Security tab for the full Gitleaks SARIF report.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  # ──────────────────────────────────────────────
  # 4. SonarCloud quality gate
  #    Requires: SONAR_TOKEN secret, sonar-project.properties in repo root
  # ──────────────────────────────────────────────
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for blame info)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Run tests with coverage
        working-directory: src
        run: npm test --if-present -- --coverageReporters=lcov

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────
  # 5. Combined security report — PR comment + Slack
  #    Requires: SLACK_WEBHOOK_URL secret (Slack Incoming Webhook URL)
  # ──────────────────────────────────────────────
  report:
    name: Security Report
    needs: [codeql, trivy, secret-scan, sonar]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download all SARIF artifacts produced by the scanner jobs above
      - name: Download SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-artifacts/
        continue-on-error: true

      # Parse every *.sarif file in the artifacts dir into findings.json
      # and emit per-severity counts as step outputs
      - name: Build findings JSON
        id: findings
        run: |
          python3 scripts/sarif_to_findings.py \
            --input-dir security-artifacts/ \
            --output    findings.json \
            --min-severity MEDIUM

          python3 - <<'PYEOF'
          import json, os
          d = json.load(open("findings.json"))
          counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0}
          for f in d["findings"]:
              sev = f["severity"]
              if sev in counts:
                  counts[sev] += 1
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as fh:
              fh.write(f"count={d['total']}\n")
              fh.write(f"critical={counts['CRITICAL']}\n")
              fh.write(f"high={counts['HIGH']}\n")
              fh.write(f"medium={counts['MEDIUM']}\n")
          PYEOF

      # Post (or update) a single combined markdown comment on the PR
      - name: Post combined PR comment
        uses: actions/github-script@v7
        env:
          CODEQL_RESULT:      ${{ needs.codeql.result }}
          TRIVY_RESULT:       ${{ needs.trivy.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SONAR_RESULT:       ${{ needs.sonar.result }}
          FINDING_COUNT:      ${{ steps.findings.outputs.count }}
          CRITICAL_COUNT:     ${{ steps.findings.outputs.critical }}
          HIGH_COUNT:         ${{ steps.findings.outputs.high }}
          MEDIUM_COUNT:       ${{ steps.findings.outputs.medium }}
        with:
          script: |
            const fs = require('fs');

            const icon  = (r) => ({ success: '✅', failure: '❌', skipped: '⏭️' }[r] ?? '⚪');
            const crit  = Number(process.env.CRITICAL_COUNT  || 0);
            const high  = Number(process.env.HIGH_COUNT       || 0);
            const med   = Number(process.env.MEDIUM_COUNT     || 0);
            const total = Number(process.env.FINDING_COUNT    || 0);

            const overall =
              crit > 0 || high > 0 ? '🔴 **FAILED** — critical / high findings require attention'
              : total > 0           ? '🟡 **WARNINGS** — medium-severity findings detected'
              :                       '🟢 **PASSED** — no significant findings';

            // Build top-findings table from findings.json
            let findingsSection = '';
            try {
              const data = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
              const top  = data.findings.slice(0, 10);
              if (top.length > 0) {
                const rows = top.map(f => {
                  const loc = f.file
                    ? `\`${f.file}${f.startLine ? ':' + f.startLine : ''}\``
                    : '—';
                  const msg = (f.message || '').slice(0, 80).replace(/\|/g, '\\|');
                  return `| ${f.tool} | **${f.severity}** | \`${f.ruleId}\` | ${loc} | ${msg} |`;
                }).join('\n');
                const more = data.findings.length > 10
                  ? `\n_…and ${data.findings.length - 10} more. See the [Security tab](../../security/code-scanning) for full results._`
                  : '';
                findingsSection = [
                  '',
                  '### Top Findings',
                  '',
                  '| Tool | Severity | Rule | Location | Message |',
                  '|------|----------|------|----------|---------|',
                  rows,
                  more,
                ].join('\n');
              }
            } catch {
              findingsSection = '\n_Could not parse findings.json._';
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const MARKER = '<!-- security-report -->';
            const body = [
              MARKER,
              '## 🛡️ Security Scan Report',
              '',
              `**Status**: ${overall}`,
              '',
              '### Scanner Results',
              '',
              '| Scanner | Status |',
              '|---------|--------|',
              `| CodeQL             | ${icon(process.env.CODEQL_RESULT)} ${process.env.CODEQL_RESULT} |`,
              `| Trivy              | ${icon(process.env.TRIVY_RESULT)} ${process.env.TRIVY_RESULT} |`,
              `| Gitleaks (secrets) | ${icon(process.env.SECRET_SCAN_RESULT)} ${process.env.SECRET_SCAN_RESULT} |`,
              `| SonarCloud         | ${icon(process.env.SONAR_RESULT)} ${process.env.SONAR_RESULT} |`,
              '',
              '### Severity Summary',
              '',
              '| 🔴 Critical | 🟠 High | 🟡 Medium |',
              '|:-----------:|:-------:|:---------:|',
              `| ${crit} | ${high} | ${med} |`,
              findingsSection,
              '',
              '---',
              `> [View full run](${runUrl}) · The autofix workflow triggers automatically on failure.`,
            ].join('\n');

            // Upsert: update existing report comment if present, otherwise create
            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing report comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
              core.info('Created new report comment');
            }

      # Send a concise summary to Slack via Incoming Webhook
      # Set SLACK_WEBHOOK_URL in repo/org secrets to enable this step
      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          CODEQL_RESULT:      ${{ needs.codeql.result }}
          TRIVY_RESULT:       ${{ needs.trivy.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SONAR_RESULT:       ${{ needs.sonar.result }}
          FINDING_COUNT:      ${{ steps.findings.outputs.count }}
          CRITICAL_COUNT:     ${{ steps.findings.outputs.critical }}
          HIGH_COUNT:         ${{ steps.findings.outputs.high }}
          MEDIUM_COUNT:       ${{ steps.findings.outputs.medium }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          PR_TITLE:           ${{ github.event.pull_request.title }}
          PR_URL:             ${{ github.event.pull_request.html_url }}
          REPO:               ${{ github.repository }}
          GITHUB_SERVER_URL:  ${{ github.server_url }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret not set — skipping Slack notification."
            exit 0
          fi

          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          crit  = int(os.environ.get("CRITICAL_COUNT", 0) or 0)
          high  = int(os.environ.get("HIGH_COUNT",     0) or 0)
          med   = int(os.environ.get("MEDIUM_COUNT",   0) or 0)
          total = int(os.environ.get("FINDING_COUNT",  0) or 0)

          if crit > 0 or high > 0:
              color  = "danger"
              status = ":red_circle: FAILED"
          elif total > 0:
              color  = "warning"
              status = ":large_yellow_circle: WARNINGS"
          else:
              color  = "good"
              status = ":white_check_mark: PASSED"

          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )

          payload = {
              "attachments": [{
                  "color": color,
                  "fallback": f"Security scan {status} for PR #{os.environ['PR_NUMBER']}",
                  "title": f"\U0001f6e1\ufe0f Security Scan \u2014 PR #{os.environ['PR_NUMBER']}: {os.environ['PR_TITLE']}",
                  "title_link": os.environ["PR_URL"],
                  "fields": [
                      {"title": "Status",   "value": status,                              "short": True},
                      {"title": "Repo",     "value": os.environ["REPO"],                 "short": True},
                      {"title": "Critical", "value": str(crit),                          "short": True},
                      {"title": "High",     "value": str(high),                          "short": True},
                      {"title": "Medium",   "value": str(med),                           "short": True},
                      {"title": "Total",    "value": str(total),                         "short": True},
                      {"title": "CodeQL",   "value": os.environ["CODEQL_RESULT"],        "short": True},
                      {"title": "Trivy",    "value": os.environ["TRIVY_RESULT"],         "short": True},
                      {"title": "Gitleaks", "value": os.environ["SECRET_SCAN_RESULT"],   "short": True},
                      {"title": "Sonar",    "value": os.environ["SONAR_RESULT"],         "short": True},
                  ],
                  "footer": f"Security Pipeline · <{os.environ['PR_URL']}|View PR> · <{run_url}|View Run>",
              }]
          }

          data = json.dumps(payload).encode()
          req  = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Slack response: {resp.status} {resp.read().decode()}")
          except urllib.error.HTTPError as e:
              print(f"Slack HTTP error: {e.code} {e.read().decode()}")
              raise
          PYEOF
